[workspace]
authors = ["dmartins <dmartins@smart-robotics.nl>"]
channels = ["robostack-kilted", "conda-forge"]
name = "cam_recorder"
platforms = [
    "linux-64",
    "osx-arm64",
]
version = "0.1.0"

[activation.env]
PYTHONPATH = "${PIXI_PROJECT_ROOT}/src:${PYTHONPATH}"
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
CYCLONEDDS_URI = "file://${PIXI_PROJECT_ROOT}/config/cyclonedds-macos.xml"

[tasks]
broadcast = "python -m cam_recorder.broadcaster"
inspect-rosbag = "python -m cam_recorder.inspect_rosbag"
replay = "python -m cam_recorder.replay"
replay_formatted = "python -m cam_recorder.replay_formatted"
replay-raw = "python -m cam_recorder.replay"
summarize-dataset = "python -m cam_recorder.summarize_dataset"
view = "python -m cam_recorder.viewer"
test = "pytest tests/ -v"

[dependencies]
python = ">=3.11"
ros-kilted-rclpy = "*"
ros-kilted-sensor-msgs = "*"
ros-kilted-cv-bridge = "*"
ros-kilted-rosbag2-py = "*"
ros-kilted-rosbag2-storage-mcap = "*"
ros-kilted-ros-base = "*"
opencv = "*"
numpy = "*"
pytest = "*"
pyyaml = "*"
